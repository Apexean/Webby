<!DOCTYPE html>
<html>
<head>
    <title>Webby</title>
    <style>
        body { margin: 0; font-family: Segoe UI, Arial; background: #f3f3f3; }

        #topbar {
            height: 48px;
            background: #ffffff;
            border-bottom: 1px solid #ddd;
            display: flex;
            align-items: center;
            padding: 0 10px;
            gap: 10px;
        }

        button {
            border: none;
            background: transparent;
            font-size: 18px;
            cursor: pointer;
        }

        #address {
            flex: 1;
            padding: 8px 12px;
            border-radius: 20px;
            border: 1px solid #ccc;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="topbar">
        <button id="back">←</button>
        <button id="forward">→</button>
        <button id="home">🏠</button>
        <input id="address" placeholder="Search or enter web address">
    </div>

    <script>
        const { ipcRenderer } = require("electron");

        const address = document.getElementById("address");

        address.addEventListener("keydown", e => {
            if (e.key === "Enter") {
                ipcRenderer.send("navigate", address.value);
            }
        });

        document.getElementById("back").onclick = () => ipcRenderer.send("back");
        document.getElementById("forward").onclick = () => ipcRenderer.send("forward");
        document.getElementById("home").onclick = () => ipcRenderer.send("navigate", "https://www.bing.com");
    </script>
</body>
</html>
